name: android-ci

# job 이름 android-ci를 Rulesets 필수 체크로 건다(main, develop).
# 경로 필터를 두지 않는다. 필터로 안 돌면 필수 체크가 영원히 대기한다.
# 진짜 비밀은 CI에 넣지 않는다. debug 빌드는 비밀 없이 된다.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4  # Gradle 캐시, 래퍼 jar 검증
      - name: lint, 단위 테스트, debug 빌드
        run: ./gradlew lint testDebugUnitTest assembleDebug --console=plain
      - name: 실패 시 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
