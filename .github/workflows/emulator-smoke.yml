name: emulator-smoke

# 앱이 켜지는지만 보는 스모크. 필수 체크(android-ci)와 분리했고 Rulesets에 넣지 않는다 → 실패해도 머지를 막지 않는다.
# 표준 Android 에뮬레이터(API 34, Google API 없음)라 Pleos 서비스가 없다. Pleos 이미지는 라이선스 동의가 필요해 쓰지 않는다.
# 비밀은 쓰지 않는다. release 서명은 이 실행에서만 만든 일회용 키(러너 임시 폴더, 실행 뒤 사라짐).

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 일회용 서명 키(이 실행에서만)
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          CI_KS_PW="$pw" keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci -storepass:env CI_KS_PW
          {
            echo "ORG_GRADLE_PROJECT_MYVISION_KEYSTORE=$RUNNER_TEMP/ci.jks"
            echo "ORG_GRADLE_PROJECT_MYVISION_KEYSTORE_PASSWORD=$pw"
            echo "ORG_GRADLE_PROJECT_MYVISION_KEY_ALIAS=ci"
          } >> "$GITHUB_ENV"
      - name: release 빌드
        run: ./gradlew assembleRelease --console=plain
      - name: KVM 사용 허용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 설치, 실행, 10초 생존 확인
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator-smoke.sh
      - name: logcat, 화면 캡처
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: smoke/
          retention-days: 7
          if-no-files-found: ignore
